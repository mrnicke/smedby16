name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Supabase deployment id
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: github-pages
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CMS_REQUIRED: 'true'
      PUBLIC_ADVANCED_EDITOR: ${{ vars.PUBLIC_ADVANCED_EDITOR || 'false' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Scan built artifact for secrets
        shell: bash
        run: |
          git add -f dist
          git -c user.name=artifact-scan -c user.email=artifact-scan@example.invalid commit -m "Temporary artifact scan"
      - name: Scan built artifact with TruffleHog
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: HEAD^
          head: HEAD
          version: 3.95.9
          extra_args: --results=verified,unknown --no-update
      - name: Generate CycloneDX SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Mark requested deployment in progress
        if: ${{ inputs.deployment_id != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.SUPABASE_DEPLOYMENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          payload=$(jq -nc --arg id "$DEPLOYMENT_ID" --argjson run "${{ github.run_id }}" '{deploymentId:$id,status:"in_progress",runId:$run}')
          timestamp=$(date +%s)
          signature=$(printf '%s' "$timestamp.$payload" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')
          curl --fail --silent --show-error -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-timestamp: $timestamp" -H "x-webhook-signature: sha256=$signature" --data-binary "$payload"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Record deployment result
        if: ${{ always() }}
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.SUPABASE_DEPLOYMENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome == 'success' && 'success' || 'failed' }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && 'code' || 'manual' }}
        run: |
          payload=$(jq -nc --arg id "$DEPLOYMENT_ID" --arg trigger "$TRIGGER_TYPE" --arg status "$DEPLOYMENT_STATUS" --argjson run "${{ github.run_id }}" '{deploymentId:$id,triggerType:$trigger,status:$status,runId:$run}')
          timestamp=$(date +%s)
          signature=$(printf '%s' "$timestamp.$payload" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')
          curl --fail --silent --show-error -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-webhook-timestamp: $timestamp" -H "x-webhook-signature: sha256=$signature" --data-binary "$payload"
