name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Supabase deployment id
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CMS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Reject secrets in the artifact
        shell: bash
        run: |
          if grep -R -E 'service_role|sb_secret_|SUPABASE_SERVICE_ROLE_KEY|GITHUB_ACTIONS_TOKEN' dist; then
            echo 'A secret-like value was found in dist.' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Mark requested deployment in progress
        if: ${{ inputs.deployment_id != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.SUPABASE_DEPLOYMENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          curl --fail --silent --show-error -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-deployment-secret: $CALLBACK_SECRET" -d "{\"deploymentId\":\"$DEPLOYMENT_ID\",\"status\":\"in_progress\",\"runId\":${{ github.run_id }}}"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment result
        if: ${{ always() }}
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.SUPABASE_DEPLOYMENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome == 'success' && 'success' || 'failed' }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'push' && 'code' || 'manual' }}
        run: |
          curl --fail --silent --show-error -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "x-deployment-secret: $CALLBACK_SECRET" -d "{\"deploymentId\":\"$DEPLOYMENT_ID\",\"triggerType\":\"$TRIGGER_TYPE\",\"status\":\"$DEPLOYMENT_STATUS\",\"runId\":${{ github.run_id }}}"
